[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prm-rl"
version = "0.1.0"
description = "Experimental framework for reward hacking in process-based RL for math reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "prm-rl" }]

dependencies = [
    "accelerate>=0.33",
    "bitsandbytes>=0.43 ; platform_system != 'Darwin'",
    "datasets>=2.20",
    "hydra-core>=1.3",
    "numpy>=1.26",
    "omegaconf>=2.3",
    "peft>=0.11",
    "pyyaml>=6.0",
    "rich>=13.7",
    "rouge-score>=0.1.2",
    "sentencepiece>=0.2",
    "scikit-learn>=1.4",
    "torch>=2.3",
    "tqdm>=4.66",
    "transformers>=4.44",
    "trl>=0.11",
    "wandb>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "ipykernel>=6.29"]
flash = ["flash-attn>=2.6 ; platform_system != 'Darwin'"]
vllm = ["vllm>=0.5"]

[project.scripts]
prmrl-prepare-gsm8k = "prm_rl.scripts.prepare_gsm8k:main"
prmrl-build-golden  = "prm_rl.scripts.build_golden:main"
prmrl-build-prm     = "prm_rl.scripts.build_prm_data:main"
prmrl-train-sft     = "prm_rl.scripts.train_sft:main"
prmrl-train-prm     = "prm_rl.scripts.train_prm:main"
prmrl-train-rl      = "prm_rl.scripts.train_rl:main"
prmrl-evaluate      = "prm_rl.scripts.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"prm_rl" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
