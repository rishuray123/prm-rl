# Arm 1 — Outcome-based reward baseline

seed: 42
run_name: arm1_outcome
output_dir: outputs/arm1_outcome

model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bf16
  device_map: auto
  attn_implementation: null
  load_in_4bit: false

data:
  split: train
  subset: main
  n: 2000
  golden_path: data/golden

training:
  num_train_epochs: 1
  max_steps: 500
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  logging_steps: 10
  save_strategy: steps
  save_steps: 200
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  num_generations: 4
  max_completion_length: 512
  temperature: 0.9
  top_p: 1.0
  beta: 0.04
  report_to:
    - none

rewards:
  - name: outcome
    weight: 1.0

eval:
  policy_path: outputs/arm1_outcome
  prm_path: outputs/prm
  traps_path: data/traps/trap_examples.json
  n_test: 200
  gen_batch_size: 8
  max_new_tokens: 512
  temperature: 0.0
  verbosity_baseline: 150.0
