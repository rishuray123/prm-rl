# Arm 1 — Phase 2 config (thesis-grade scale).
#
# Meant to be launched via slurm/phase2_sweep.sh which will fan out
# 6 arms × 3 seeds → 18 sbatch jobs on the `gh` queue.
#
# Sizing (see docs/results.md for Phase 2 outcomes):
#   * Policy:    Qwen2.5-7B-Instruct
#   * Data:      n=2000 golden slice (data/golden_v2)
#   * PRM:       outputs/prm_v2 (built with synthetic negatives; only
#                used by arms 2/3/4/6)
#   * GRPO:      max_steps=500, num_generations=8, batch 4 × grad_accum 4
#   * Eval:      n_test=500, temp=0.0, verbosity baseline calibrated
#                against SFT anchor (still 150 tokens as a placeholder;
#                recalibrate after §6.1 landed — see thesis §5.4).
#
# Wall-clock budget on one GH200: ~2.5–4 h. Requesting 5 h per job to
# have headroom on the `gh` queue.

seed: 42
run_name: arm1_phase2
output_dir: outputs/arm1_phase2

model:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: bf16
  device_map: auto
  attn_implementation: null
  load_in_4bit: false

data:
  split: train
  subset: main
  n: 2000
  golden_path: data/golden_v2

training:
  num_train_epochs: 1
  max_steps: 500
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: steps
  save_steps: 200
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  num_generations: 8
  max_completion_length: 512
  temperature: 0.9
  top_p: 1.0
  beta: 0.04
  report_to: [none]

rewards:
  - name: outcome
    weight: 1.0

eval:
  policy_path: outputs/arm1_phase2
  prm_path: outputs/prm_v2
  traps_path: data/traps/trap_examples.json
  n_test: 500
  gen_batch_size: 8
  max_new_tokens: 512
  temperature: 0.0
  verbosity_baseline: 150.0
