# PRM v2 — the first PRM trained with synthetic negatives.
#
# Motivation: the smoke PRM (see prm_smoke.yaml) was trained with
# `strategy='gsm8k_native'`, which only labels positive steps. That
# gives the classifier no gradient signal and it collapses to
# `p ≈ 1.0` for every step. Arms 2/3/4/6 then receive a nearly-uniform
# process reward and cannot meaningfully differentiate completions.
#
# This config trains a bigger DeBERTa-v3-base PRM on a larger golden
# slice, with the synthetic-negative pipeline enabled at
# `inject_negatives_prob=0.5` (see build_prm_data --help and
# src/prm_rl/data/prm_data.py).
#
# Data path assumption: run
#   python -m prm_rl.scripts.build_golden --split train --n 2000 \
#       --out data/golden_v2 --strategy gsm8k_native
#   python -m prm_rl.scripts.build_prm_data --golden data/golden_v2 \
#       --out data/prm_v2 --inject_negatives_prob 0.5 --seed 0
# before submitting this config. The prm training script picks up the
# expanded rows from the golden_path since it re-runs build_prm_dataset
# on load; if you prefer to pre-materialise, set the golden_path to
# data/prm_v2 and swap train_prm's loader accordingly.

seed: 42
run_name: prm_v2
output_dir: outputs/prm_v2

model:
  # Switched from microsoft/deberta-v3-base to distilbert-base-uncased
  # after three failed attempts with DeBERTa-v3 (KB §6.1 attempts 1-3):
  # its disentangled-attention forward pass is numerically fragile in
  # both fp16 (NaN in load_prm inference) and fp32 (NaN gradients
  # during training even at lr=2e-5 with tight clipping + label
  # smoothing). DistilBERT has no disentangled attention, uses standard
  # scaled-dot-product attention, and fp32-trains reliably with the
  # default HF hyperparameters. 66M params trains in ~4-6 min on H200.
  name: distilbert-base-uncased

data:
  golden_path: data/golden_v2
  val_size: 0.10
  # Passed through to build_prm_dataset() at train time (see
  # src/prm_rl/scripts/train_prm.py — extend to read these).
  inject_negatives_prob: 0.5
  max_negatives_per_example: 2

training:
  # Iteration history (all on microsoft/deberta-v3-base):
  #   Attempt 1 (lr=2e-5, bf16=true, max_length=1024, right-trunc):
  #     classifier collapsed to prior (pred=0.719 constant).
  #   Attempt 2 (lr=5e-5, fp32, max_length=512, left-trunc):
  #     loss started dropping then grad NaN'd at step 5 (lr≈2.9e-5).
  #   Attempt 3 (lr=2e-5, fp32, warmup 10%, grad clip 0.5, label
  #              smoothing 0.05, same truncation/max_length as #2):
  #     grad NaN'd at step 12 (lr≈1.7e-5).
  #
  # Attempt 4 (this config): abandoned DeBERTa-v3, switched model to
  # distilbert-base-uncased above. Back to standard DistilBERT
  # hyperparameters -- no need for the exotic clipping / smoothing
  # / long-warmup gymnastics that couldn't stabilise DeBERTa. Still
  # keep max_length=512 (native for both models) and left truncation
  # in prm_train.py so the label-carrying step is preserved.
  num_train_epochs: 3
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  label_smoothing_factor: 0.0
  logging_steps: 20
  bf16: false
  max_length: 512
  gradient_checkpointing: false
  report_to: [none]

  # Success criterion for Phase 2 gating (§6.1): val F1 >= 0.7 AND the
  # PRM must actually discriminate (positives >0.6, negatives <0.4 on
  # the smoke probe in KB §2.9). F1 alone is not sufficient — on a
  # 71%-positive dataset the "always predict positive" baseline
  # already gets F1 = 0.83.
