# Arm 3 — Phase 2 config (prefix consistency, PRM v2).

seed: 42
run_name: arm3_phase2
output_dir: outputs/arm3_phase2

model:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: bf16
  device_map: auto

data:
  split: train
  subset: main
  n: 2000
  golden_path: data/golden_v2

training:
  num_train_epochs: 1
  max_steps: 500
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: steps
  save_steps: 200
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  num_generations: 8
  max_completion_length: 512
  temperature: 0.9
  top_p: 1.0
  beta: 0.04
  report_to: [none]

rewards:
  - name: prefix_consistency
    weight: 1.0
    prm_path: outputs/prm_v2
    device: cuda
    threshold: 0.5
    scale: 1.0

eval:
  policy_path: outputs/arm3_phase2
  prm_path: outputs/prm_v2
  traps_path: data/traps/trap_examples.json
  n_test: 500
  gen_batch_size: 8
  max_new_tokens: 512
  temperature: 0.0
  verbosity_baseline: 150.0
