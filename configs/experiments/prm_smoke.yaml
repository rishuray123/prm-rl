# PRM smoke config — trains a tiny DeBERTa classifier on 64 golden GSM8K
# examples in ~1 min. Used by arms 2 / 3 / 4 / 6 smoke configs.
#
# ⚠️  With strategy='gsm8k_native' every step gets label=1, so the PRM
# has no negatives to learn from and will collapse to outputting ~1.0
# for everything. This is fine for a *plumbing* smoke test but means
# arms 2/3/4/6 rewards won't meaningfully differentiate completions.
# For real training swap in strategy='teacher' or 'verifier' in
# scripts/build_golden.py once an oracle model is available.
# See docs/knowledge-base.md §6.4.

seed: 42
run_name: prm_smoke
output_dir: outputs/prm_smoke

model:
  name: microsoft/deberta-v3-xsmall   # 22M params, ~44 MB bf16

data:
  golden_path: data/golden_smoke      # built by smoke_all_arms.sh
  val_size: 0.1

training:
  num_train_epochs: 1
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  logging_steps: 10
  bf16: true
  max_length: 512
  gradient_checkpointing: false
  report_to: [none]
