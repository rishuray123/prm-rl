num_train_epochs: 1
max_steps: 500
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.03
logging_steps: 10
save_strategy: steps
save_steps: 200
save_total_limit: 2
bf16: true
gradient_checkpointing: true
report_to:
  - none

# GRPO-specific
num_generations: 4
max_completion_length: 512
temperature: 0.9
top_p: 1.0
beta: 0.04            # KL coefficient (Arm 7 turns this up)
